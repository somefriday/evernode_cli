[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evernode-manager"
version = "0.5.5"
description = "Build and manage Everscale validator node containers"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
evernode = "evernode.cli:main"

[tool.setuptools]
# The vendored kit and contract under evernode/vendor/, as MANIFEST.in lists them;
# setup.py adds the vote engine's sources there.
include-package-data = true

[tool.setuptools.packages.find]
include = ["evernode*"]
# Directories without __init__.py (the vendored kit) are data, not packages.
namespaces = false

[tool.setuptools.package-data]
evernode = ["assets/*"]
