# Scan this file for changes every 30 seconds
# https://docs.rs/log4rs/0.8.3/log4rs/encode/pattern/index.html
refresh_rate: 30 seconds
appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l} [{h({t})}] {I}: {m}{n}"
  stdout_ref:
    kind: console
    encoder:
      pattern: "{f}:{L} {l} [{h({t})}] {I}: {m}{n}"
  logfile:
    kind: file
    path: "/ever-node/logs/output.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l} [{h({t})}] {I}: {m}{n}"
  rolling_logfile:
    kind: rolling_file
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l} [{h({t})}] {I}: {m}{n}"
    path: /ever-node/logs/output.log
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10gb
      roller:
        kind: fixed_window
        pattern: '/ever-node/logs/output_{}.log'
        base: 1
        count: 1
root:
  level: error
  appenders:
    - rolling_logfile
loggers:
  # node messages
  ever_node:
    level: debug
  boot:
    level: info
  sync:
    level: info
  storage:
    level: info
  # adnl messages
  adnl:
    level: error
  overlay:
    level: error
  rldp:
    level: error
  dht:
    level: error
  # block messages
  ever_block:
    level: off
  # block messages
  executor:
    level: off
  # tvm messages
  tvm:
    level: off
  librdkafka:
    level: error
  validator:
    level: debug
  validator_manager:
    level: info
  catchain:
    level: info
  validator_session:
    level: debug
  telemetry:
    level: debug
  validate_query:
    level: debug
  ext_messages:
    level: info
  remp:
    level: info
  verificator:
    level: info
