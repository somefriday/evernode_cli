[package]
name = "evernode-vote"
version = "0.2.2"
edition = "2024"
rust-version = "1.90"
description = "Changes Everscale's network config by validator vote: burns the config master key (the \"dictator\"), sets params, upgrades code"

[dependencies]
# ever-node's control-server client (ADNL over TCP), the same tags state-fetcher builds with
adnl = { git = "https://github.com/everx-labs/ever-adnl.git", tag = "0.11.32", features = ["client"] }
ever_block = { git = "https://github.com/everx-labs/ever-block.git", tag = "1.11.20" }
# ever-node's own config parser and transaction executor (the tags ever-node e4068621 builds with):
# values are checked as the node reads them, and messages are dry-run on the contract's real code
ever_block_json = { git = "https://github.com/everx-labs/ever-block-json.git", tag = "0.9.37" }
ever_executor = { git = "https://github.com/everx-labs/ever-executor.git", tag = "1.18.22" }
# runs wallet getters locally (what ever-sdk's run_tvm does), the tag ever_executor uses
ever_vm = { git = "https://github.com/everx-labs/ever-vm.git", tag = "2.2.21" }
ton_api = { git = "https://github.com/everx-labs/ever-tl.git", package = "ton_api", tag = "0.4.29" }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1.0"
base64 = "0.22"
# a wallet key from its seed phrase, as ever-cli derives it: BIP39 (12 or 24 words), then BIP32 on secp256k1
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
bip39 = "2.2"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
# the chain through a GraphQL endpoint: reads, sends, transactions
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# same version the migration tooling uses; the account and message layouts it writes are accepted by ever-node
tycho-types = { version = "=0.3.6", features = ["models", "abi"] }

[profile.release]
debug = false
